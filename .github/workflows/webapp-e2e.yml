name: webapp-e2e

# Vercel reports each deployment to GitHub: run the visitor journey once the site is live, on the
# PR preview and on production. The result shows up as a check on the deployed commit.
on: deployment_status

defaults:
  run:
    working-directory: webapp

jobs:
  e2e:
    # Only the website once it is up ("Preview – pygments", "Production – pygments"), not the
    # Sanity studio ("… – pygments-studio")
    if: >-
      github.event.deployment_status.state == 'success' &&
      endsWith(github.event.deployment_status.environment, ' pygments')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            webapp/playwright-report
            webapp/test-results
          retention-days: 7
